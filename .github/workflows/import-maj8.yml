name: Import maj 25-10 h (sans mention prototype)
on:
  push:
    paths: ['.github/workflows/import-maj8.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: import-maj8
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Recuperer et verifier l'archive
        run: |
          curl -fsSL https://h.uguu.se/lViqMzTs.tgz -o b.tgz
          echo "1f47005368e2f9ab7e2a7ebb81f07b49cf9ec6a8e1ad36c5aa45b40c1f3f41d0  b.tgz" | sha256sum -c
          mkdir -p /tmp/b && tar xzf b.tgz -C /tmp/b && rm b.tgz
          cp -r /tmp/b/src/* src/
      - name: Reconstruire docs (PUBLIC=1)
        run: |
          cp -r docs site
          cp docs/data/occupants.json src/occupants.json
          cd src && python3 convergences.py && PUBLIC=1 python3 build.py && cd ..
          cp site-public/index.html site-public/sowatt-carte-autonome.html docs/
          cp site-public/data/* docs/data/
          rm -rf site site-public src/occupants.json src/__pycache__
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs
          git commit -m "En-tete : retrait de la mention prototype oct. 2026"
          git push
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
